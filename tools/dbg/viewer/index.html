<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WW2 Debug Viewer</title>
<style>
  :root { --bg:#14181c; --panel:#1c2228; --fg:#d7dde3; --dim:#8b97a3; --line:#2c353d; --acc:#5fb0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,Segoe UI,sans-serif; display:flex; height:100vh; overflow:hidden; }
  #side { width:300px; background:var(--panel); border-right:1px solid var(--line); padding:10px; overflow:auto; flex:none; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  canvas { flex:1; width:100%; display:block; cursor:grab; }
  #bar { display:flex; gap:8px; align-items:center; padding:8px 10px; background:var(--panel); border-top:1px solid var(--line); }
  #bar input[type=range] { flex:1; }
  h3 { margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  select,button { background:#262e36; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 8px; font:inherit; }
  button:hover { border-color:var(--acc); cursor:pointer; }
  label { display:block; color:var(--dim); }
  table { border-collapse:collapse; width:100%; }
  td { padding:1px 4px; font-variant-numeric:tabular-nums; }
  .ev { color:var(--dim); font-size:12px; cursor:pointer; } .ev:hover { color:var(--fg); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  #warn { color:#ff8a65; font-size:12px; }
</style>
</head>
<body>
<div id="side">
  <div><b>WW2 Debug Viewer</b> · <a href="/assets.html" style="color:#5fb0ff">models &amp; textures</a></div>
  <h3>Run</h3>
  <select id="runs" style="width:100%"></select>
  <label style="margin-top:4px">or drop a run .json on the map</label>
  <h3>Show</h3>
  <label><input type="checkbox" id="oProps" checked> props</label>
  <label><input type="checkbox" id="oGraph" checked> taxi graph</label>
  <label><input type="checkbox" id="oRoutes" checked> routes</label>
  <label><input type="checkbox" id="oTrails" checked> trails</label>
  <label><input type="checkbox" id="oLabels" checked> labels</label>
  <h3>Aircraft</h3>
  <table id="ac"></table>
  <div id="warn"></div>
  <h3>Events</h3>
  <div id="events"></div>
  <h3>Run info</h3>
  <div id="info" style="color:var(--dim);font-size:12px"></div>
</div>
<div id="main">
  <canvas id="cv"></canvas>
  <div id="bar">
    <button id="play">Play</button>
    <input type="range" id="t" min="0" max="0" step="1" value="0">
    <span id="tl" style="min-width:90px;text-align:right">0.0 s</span>
    <select id="spd"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>
  </div>
</div>
<script>
const COL = {parked:'#8b97a3', taxiing:'#6bd36b', holding:'#ffd54a', stopped:'#ff8a65', lined_up:'#5fb0ff'};
const AGC = ['#ff6b6b','#4dd0e1','#ffd54f','#ba68c8','#81c784','#ffb74d','#90a4ae','#f06292'];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let run = null, fi = 0, playing = false, view = {x:0,z:0,s:0.5}, last = 0, selAc = null;
const $ = id => document.getElementById(id);

async function loadList() {
  try {
    const r = await (await fetch('/api/runs')).json();
    $('runs').innerHTML = r.map(n => `<option>${n}</option>`).join('');
    if (r.length) { const q = new URLSearchParams(location.search).get('run'); if (q && r.includes(q)) $('runs').value = q; await loadRun($('runs').value); }
  } catch (e) { $('info').textContent = 'No server: drop a run .json onto the map.'; }
}
async function loadRun(n) { setRun(await (await fetch('/api/run?name=' + encodeURIComponent(n))).json()); }
function setRun(d) {
  cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
  run = d; fi = 0; playing = false; $('play').textContent = 'Play';
  $('t').max = Math.max(0, d.frames.length - 1); $('t').value = 0;
  const L = d.layout, pts = [];
  (L.paved||[]).forEach(p => { if (Array.isArray(p[0])) pts.push(p[0], p[1]); });
  (L.dispersals||[]).forEach(p => pts.push(p));
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9; pts.forEach(p => { x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);z0=Math.min(z0,p[1]);z1=Math.max(z1,p[1]); });
  if (!pts.length) { x0=-300;x1=300;z0=-600;z1=600; }
  view.x=(x0+x1)/2; view.z=(z0+z1)/2; view.s=Math.max(0.05, Math.min(cv.width/(x1-x0+160), cv.height/(z1-z0+160)));
  $('info').innerHTML = `${L.name||''} (${L.style}) · runway ${L.runway?.length}×${L.runway?.width} m · heading ${L.heading_deg}°<br>${d.frames.length} frames @ ${d.hz} Hz · ${d.sim_secs}s simulated<br><b>${d.reason}</b>`;
  $('events').innerHTML = d.events.map(e => `<div class="ev" data-t="${e.t}">${e.t.toFixed(1)}s ${e.kind}: ${e.msg}</div>`).join('');
  document.querySelectorAll('.ev').forEach(el => el.onclick = () => seek(+el.dataset.t));
  d.analysis = analyse(d); showWarn(); draw();
}
function seek(t) { if (!run) return; fi = Math.min(run.frames.length-1, Math.max(0, Math.round(t*run.hz))); $('t').value = fi; draw(); }

function analyse(d) { // spacing + stall flags per frame
  const out = [];
  for (const [t, rows] of d.frames) {
    const f = [];
    for (let i=0;i<rows.length;i++) for (let j=i+1;j<rows.length;j++) {
      const a=rows[i], b=rows[j], dist=Math.hypot(a[1]-b[1], a[2]-b[2]);
      const ra=d.agents.find(x=>x.id===a[0])?.radius||8, rb=d.agents.find(x=>x.id===b[0])?.radius||8;
      if (dist < (ra+rb)*0.6) f.push([a[0], b[0], dist]);
    }
    out.push(f);
  }
  return out;
}
function showWarn() {
  const n = run.analysis.filter(f => f.length).length;
  $('warn').textContent = n ? `${n} frame(s) with overlapping aircraft (red rings)` : '';
}

function resize() { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; draw(); }
const W2S = (x,z) => [ (x-view.x)*view.s + cv.width/2, (z-view.z)*view.s + cv.height/2 ];

function draw() {
  ctx.fillStyle = '#243016'; ctx.fillRect(0,0,cv.width,cv.height);
  if (!run) return;
  const L = run.layout; ctx.lineCap = 'butt';
  // pavement
  (L.paved||[]).forEach(p => {
    if (!Array.isArray(p[0])) return;
    const a=W2S(...p[0]), b=W2S(...p[1]), hw=(p[2]||4)*view.s;
    ctx.strokeStyle='#5c5c58'; ctx.fillStyle='#5c5c58'; ctx.lineWidth=Math.max(1,hw*2);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    if (Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]) < 0.5) { ctx.beginPath(); ctx.arc(a[0],a[1],hw,0,7); ctx.fill(); }
  });
  // runway centreline
  const rw = L.runway; if (rw) { ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.setLineDash([12,10]); ctx.lineWidth=1; const a=W2S(0,-rw.length/2), b=W2S(0,rw.length/2); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]); }
  if ($('oProps').checked) (L.props||[]).forEach(p => {
    const c=W2S(p[0],p[1]); ctx.save(); ctx.translate(...c); ctx.rotate(p[4]*Math.PI/180);
    ctx.fillStyle='rgba(120,90,60,.8)'; ctx.fillRect(-p[2]*view.s,-p[3]*view.s,p[2]*2*view.s,p[3]*2*view.s); ctx.restore();
  });
  if ($('oGraph').checked) {
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1;
    (L.taxi_edges||[]).forEach(e => { const a=W2S(...L.taxi_nodes[e[0]]), b=W2S(...L.taxi_nodes[e[1]]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); });
    ctx.fillStyle='#fff'; (L.taxi_nodes||[]).forEach(n => { const p=W2S(...n); ctx.fillRect(p[0]-1.5,p[1]-1.5,3,3); });
  }
  (L.dispersals||[]).forEach((d,i) => { const p=W2S(...d); ctx.strokeStyle = i===L.keep_clear?'#ffd54a':'rgba(255,255,255,.4)'; ctx.strokeRect(p[0]-3,p[1]-3,6,6); });
  if (L.hold) { const p=W2S(...L.hold); ctx.strokeStyle='#ffd54a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p[0],p[1],7,0,7); ctx.stroke(); }
  if (L.entry) { const p=W2S(...L.entry); ctx.strokeStyle='#4dd0e1'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p[0],p[1],5,0,7); ctx.stroke(); }
  const frame = run.frames[fi]; if (!frame) return;
  run.agents.forEach((ag,i) => {
    const col = AGC[i % AGC.length];
    if ($('oRoutes').checked) { ctx.strokeStyle = col; ctx.globalAlpha = .55; ctx.lineWidth = 1.5; ctx.beginPath(); ag.route.forEach((r,k) => { const p=W2S(...r); k?ctx.lineTo(...p):ctx.moveTo(...p); }); ctx.stroke(); ctx.globalAlpha = 1; ag.route.forEach(r => { const p=W2S(...r); ctx.fillStyle=col; ctx.fillRect(p[0]-2,p[1]-2,4,4); }); }
    if ($('oTrails').checked) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); let st=false; for (let k=0;k<=fi;k++) { const r=run.frames[k][1].find(x=>x[0]===ag.id); if(!r) continue; const p=W2S(r[1],r[2]); st?ctx.lineTo(...p):(ctx.moveTo(...p),st=true); } ctx.stroke(); }
  });
  frame[1].forEach(r => {
    const i = run.agents.findIndex(a=>a.id===r[0]), ag = run.agents[i], c = W2S(r[1], r[2]);
    const rad = Math.max(5, (ag?.radius||8)*view.s*1.0);
    ctx.save(); ctx.translate(...c); ctx.rotate(r[3]*Math.PI/180);
    ctx.fillStyle = COL[r[5]] || '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,-rad*1.2); ctx.lineTo(rad*.9,rad*.8); ctx.lineTo(0,rad*.4); ctx.lineTo(-rad*.9,rad*.8); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    if (selAc === r[0]) { ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(c[0],c[1],rad*1.6,0,7); ctx.stroke(); }
    if ($('oLabels').checked) { ctx.fillStyle='#fff'; ctx.font=`${11*devicePixelRatio}px system-ui`; ctx.fillText(`${r[0]} ${r[4].toFixed(1)}m/s`, c[0]+rad*1.3, c[1]-rad*.6); }
  });
  (run.analysis[fi]||[]).forEach(([a,b]) => { [a,b].forEach(id => { const r=frame[1].find(x=>x[0]===id), c=W2S(r[1],r[2]); ctx.strokeStyle='#ff1744'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(c[0],c[1],16*devicePixelRatio,0,7); ctx.stroke(); }); });
  $('tl').textContent = frame[0].toFixed(1) + ' s';
  $('ac').innerHTML = frame[1].map(r => { const i=run.agents.findIndex(a=>a.id===r[0]); return `<tr onclick="selAc='${r[0]}';draw()" style="cursor:pointer"><td><span class="sw" style="background:${AGC[i%AGC.length]}"></span>${r[0]}</td><td style="color:${COL[r[5]]}">${r[5]}</td><td>${r[4].toFixed(1)}</td><td>wp${r[6]}</td></tr>`; }).join('');
}

// interaction
let drag = null;
cv.onmousedown = e => { drag = {x:e.clientX, y:e.clientY, vx:view.x, vz:view.z}; cv.style.cursor='grabbing'; };
addEventListener('mouseup', () => { drag = null; cv.style.cursor='grab'; });
addEventListener('mousemove', e => { if (!drag) return; view.x = drag.vx - (e.clientX-drag.x)*devicePixelRatio/view.s; view.z = drag.vz - (e.clientY-drag.y)*devicePixelRatio/view.s; draw(); });
cv.onwheel = e => { e.preventDefault(); const f = e.deltaY<0?1.15:1/1.15; const rx=(e.offsetX*devicePixelRatio-cv.width/2)/view.s+view.x, rz=(e.offsetY*devicePixelRatio-cv.height/2)/view.s+view.z; view.s*=f; view.x=rx-(e.offsetX*devicePixelRatio-cv.width/2)/view.s; view.z=rz-(e.offsetY*devicePixelRatio-cv.height/2)/view.s; draw(); };
cv.ondragover = e => e.preventDefault();
cv.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) f.text().then(t => setRun(JSON.parse(t))); };
$('t').oninput = e => { fi = +e.target.value; draw(); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; last = performance.now(); if (run && fi >= run.frames.length-1) fi = 0; };
$('runs').onchange = e => loadRun(e.target.value);
['oProps','oGraph','oRoutes','oTrails','oLabels'].forEach(id => $(id).onchange = draw);
addEventListener('keydown', e => { if (e.code==='Space') { e.preventDefault(); $('play').click(); } if (e.code==='ArrowRight') { fi=Math.min(run.frames.length-1,fi+1); $('t').value=fi; draw(); } if (e.code==='ArrowLeft') { fi=Math.max(0,fi-1); $('t').value=fi; draw(); } });
let ft = 0;
function loop(now) { if (playing && run) { const dt=(now-last)/1000*(+$('spd').value); last=now; if (Math.floor(ft)!==fi) ft=fi; ft += dt*run.hz; if (ft >= run.frames.length-1) { ft=run.frames.length-1; playing=false; $('play').textContent='Play'; } fi = Math.floor(ft); $('t').value = fi; draw(); } requestAnimationFrame(loop); }
addEventListener('resize', resize); resize(); loadList(); requestAnimationFrame(loop);
</script>
</body>
</html>
