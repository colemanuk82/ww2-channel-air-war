<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WW2 Asset Viewer</title>
<style>
  :root { --bg:#14181c; --panel:#1c2228; --fg:#d7dde3; --dim:#8b97a3; --line:#2c353d; --acc:#5fb0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,Segoe UI,sans-serif; display:flex; height:100vh; overflow:hidden; }
  #side { width:280px; background:var(--panel); border-right:1px solid var(--line); padding:10px; overflow:auto; flex:none; }
  #main { flex:1; position:relative; min-width:0; overflow:auto; }
  #three { position:absolute; inset:0; } #three canvas { display:block; }
  a { color:var(--acc); } h3 { margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .tabs button, button, select { background:#262e36; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 8px; font:inherit; cursor:pointer; }
  .tabs button.on { border-color:var(--acc); }
  .item { padding:2px 6px; cursor:pointer; border-radius:3px; } .item:hover { background:#262e36; } .item.on { background:#2d3a48; }
  label { display:block; color:var(--dim); }
  #hud { position:absolute; left:10px; top:10px; background:rgba(20,24,28,.85); padding:8px 10px; border-radius:6px; font-size:12px; max-width:340px; }
  #tex { padding:14px; display:none; } #tex canvas { image-rendering:pixelated; display:block; margin:6px 0; background:#000; }
  #livery { max-width:100%; max-height:130px; object-fit:contain; margin-top:6px; border:1px solid var(--line); }
  #nodes { font-size:11px; color:var(--dim); max-height:60px; overflow:auto; }
  .nd { cursor:pointer; display:inline-block; margin:1px 3px 1px 0; padding:0 4px; border:1px solid var(--line); border-radius:3px; } .nd.off { opacity:.35; text-decoration:line-through; }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="side">
  <div><b>WW2 Asset Viewer</b> · <a href="/">taxi view</a></div>
  <div class="tabs" style="margin-top:8px"><button id="tM" class="on">Models</button> <button id="tT">Textures</button></div>
  <input id="flt" placeholder="filter" style="width:100%;margin-top:6px;background:#262e36;color:var(--fg);border:1px solid var(--line);padding:3px 6px">
  <div id="list" style="margin-top:6px"></div>
</div>
<div id="main">
  <div id="three"><div id="hud">
    <div id="mi">Pick a model.</div>
    <label><input type="checkbox" id="wire"> wireframe</label>
    <label><input type="checkbox" id="flat" checked> flat shading</label>
    <div style="margin:4px 0">Camera: <button data-v="side">side</button> <button data-v="top">top</button> <button data-v="front">front</button></div>
    <label>Distance (m) <input type="range" id="dist" min="5" max="3000" value="40" style="width:150px"> <span id="dv">40</span></label>
    <div id="px" style="color:var(--dim)"></div>
    <div id="nodes"></div>
    <img id="livery" alt="livery sheet">
  </div></div>
  <div id="tex"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const $ = id => document.getElementById(id);
let mode = 'models', models = [], texs = [], cur = null, obj = null;
const el = $('three');
const renderer = new THREE.WebGLRenderer({ antialias:true }); el.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3b4a52);
const cam = new THREE.PerspectiveCamera(35, 1, 0.5, 20000);
const ctl = new OrbitControls(cam, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(30, 50, 20); scene.add(sun);
scene.add(new THREE.GridHelper(200, 40, 0x666666, 0x444444));
function size() { renderer.setSize(el.clientWidth, el.clientHeight); cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', size);
(function loop() { requestAnimationFrame(loop); if (mode==='models') { ctl.update(); renderer.render(scene, cam); updPx(); } })();

const NATION = { luftwaffe:0x8a8f86, raf:0x6c7a52, usaaf:0x7d7f58 };
function tint(mid) { const l = (models.find(m=>m.id===mid)?.liveries[0]||'').split('_').pop(); return NATION[l] || 0x888888; }
async function showModel(id) {
  cur = id; const info = models.find(m => m.id === id);
  if (obj) scene.remove(obj);
  const g = await new GLTFLoader().loadAsync('/api/glb?id=' + id); obj = g.scene;
  obj.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({ color: tint(id), flatShading: $('flat').checked, wireframe: $('wire').checked, roughness: .7 }); o.userData.base = o.material; } });
  obj.position.y = 1.5; scene.add(obj);
  $('mi').innerHTML = `<b>${id}</b> · ${info.tris.toLocaleString()} tris · ${info.size.join(' × ')} m · UV: ${info.has_uv ? 'yes' : 'none (shader-mapped)'}${info.missing_nodes.length ? '<br><span style="color:#ff8a65">missing: ' + info.missing_nodes.join(', ') + '</span>' : ''}`;
  $('nodes').innerHTML = info.nodes.map(n => `<span class="nd" data-n="${n}">${n}</span>`).join('');
  document.querySelectorAll('.nd').forEach(s => s.onclick = () => { s.classList.toggle('off'); obj.traverse(o => { if (o.name === s.dataset.n) o.visible = !s.classList.contains('off'); }); });
  $('livery').src = info.liveries[0] ? '/api/tex?path=liveries/' + info.liveries[0] + '.png' : '';
  view('side');
}
function view(v) {
  const d = +$('dist').value, t = new THREE.Vector3(0, 2.5, 0);
  const p = { side:[d,2.5,0], top:[0,d,0.01], front:[0,2.5,-d] }[v];
  cam.position.set(...p); ctl.target.copy(t); cam.setViewOffset(el.clientWidth, el.clientHeight, -150, 0, el.clientWidth, el.clientHeight); ctl.update();
}
function updPx() { const d = cam.position.distanceTo(ctl.target); const info = models.find(m=>m.id===cur); if (!info) return; $('dv').textContent = Math.round(d);
  const span = Math.max(info.size[0], info.size[2]); const px = span / (2 * d * Math.tan(cam.fov * Math.PI / 360)) * renderer.domElement.height; $('px').textContent = `on screen: ~${Math.round(px)} px across (at ${renderer.domElement.height}px tall)`; }
$('dist').oninput = e => { const d = +e.target.value, dir = cam.position.clone().sub(ctl.target).normalize(); cam.position.copy(ctl.target).addScaledVector(dir, d); ctl.update(); };
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => view(b.dataset.v));
const restyle = () => obj && obj.traverse(o => { if (o.isMesh) { o.material.wireframe = $('wire').checked; o.material.flatShading = $('flat').checked; o.material.needsUpdate = true; } });
$('wire').onchange = restyle; $('flat').onchange = restyle;

function showTex(t) {
  $('three').style.display = 'none'; $('tex').style.display = 'block'; mode = 'textures';
  const img = new Image(); img.onload = () => {
    const w = img.width, h = img.height;
    let html = `<b>${t.path}</b> · ${w}×${h} · ${(t.bytes/1024)|0} KB<br><span style="color:var(--dim)">Original, then the same texture tiled 4×4 and shrunk as it would be at increasing distance (1/2, 1/4, 1/8, 1/16 scale) to show patterns, aliasing and moire.</span><div id="cvs"></div>`;
    $('tex').innerHTML = html; const host = $('cvs');
    const mk = (label, scale, tile) => { const c = document.createElement('canvas'); const cw = Math.max(8, Math.round(w * tile * scale)), ch = Math.max(8, Math.round(h * tile * scale)); c.width = cw; c.height = ch;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; const tw = w * scale, th = h * scale; for (let i = 0; i < tile; i++) for (let j = 0; j < tile; j++) x.drawImage(img, i * tw, j * th, tw, th);
      c.style.width = Math.min(cw, 512) * (cw < 128 ? 2 : 1) + 'px'; const d = document.createElement('div'); d.textContent = label; host.appendChild(d); host.appendChild(c); };
    mk('1x (single tile)', 1, 1); mk('tiled 4x4 @ 1/2', .5, 4); mk('tiled 4x4 @ 1/4', .25, 4); mk('tiled 4x4 @ 1/8', .125, 4); mk('tiled 4x4 @ 1/16', .0625, 4);
  }; img.src = '/api/tex?path=' + encodeURIComponent(t.path);
}
function render() {
  const f = $('flt').value.toLowerCase(), L = $('list'); L.innerHTML = '';
  const items = mode === 'models' ? models.map(m => ({ k:m.id, s:`${m.tris >> 10}k tris` })) : texs.map(t => ({ k:t.path, s:(t.size || []).join('×') }));
  items.filter(i => i.k.toLowerCase().includes(f)).forEach(i => { const d = document.createElement('div'); d.className = 'item' + (i.k === cur ? ' on' : ''); d.innerHTML = `${i.k} <span style="color:var(--dim)">${i.s}</span>`;
    d.onclick = () => { cur = i.k; if (mode === 'models') showModel(i.k); else showTex(texs.find(t => t.path === i.k)); render(); }; L.appendChild(d); });
}
function setMode(m) { mode = m; $('tM').classList.toggle('on', m === 'models'); $('tT').classList.toggle('on', m === 'textures'); $('three').style.display = m === 'models' ? 'block' : 'none'; $('tex').style.display = m === 'models' ? 'none' : 'block'; if (m==='models') size(); cur = null; render(); }
$('tM').onclick = () => setMode('models'); $('tT').onclick = () => setMode('textures'); $('flt').oninput = render;
models = await (await fetch('/api/models')).json(); texs = await (await fetch('/api/textures')).json();
size(); render();
const q = new URLSearchParams(location.search); if (q.get('model')) { showModel(q.get('model')); cur = q.get('model'); render(); }
if (q.get('tex')) { setMode('textures'); showTex(texs.find(t => t.path === q.get('tex'))); }
</script>
</body>
</html>
